# STRANDLINE DEV EVENTS
#
# Past floods used to tune and score the pipeline (leave-one-event-out), plus
# no-flood controls that must produce almost no flood pixels.
#
# Rule 1: the `reference` files are SCORING ONLY. They live under data/reference/
# and are read by validation/ and eval/ only, never by strandline/.
# Rule 4: no event here may overlap the held-out exclusion bbox declared in the
# gates file (the rules test checks this). The case study stays out of this file.
# `eval/fetch_references.py` additionally refuses to fetch anything whose name or
# URL contains a forbidden held-out name.
#
# HOW EACH bbox WAS CHOSEN (Rule 3.2 - no shrinking of the scoring area):
# the bbox is the reference product's OWN published extent - the Copernicus EMS
# areaOfInterestA polygon, the Kuro Siwo AOI polygon, or the Sentinel Asia
# product footprint. It is never drawn by hand and never adjusted after looking
# at a score. Where a reference covers more ground than one run can, the event
# is dropped rather than clipped.
#
# HOW THE MOUNTAIN EVENTS WERE CHOSEN: `terrain` below is measured, not asserted.
# Each line is computed from the public Copernicus DEM 90 m COGs over the exact
# bbox (relief = max-min elevation; slope from the DEM gradient). For scale, the
# held-out case-study area measures relief 5383 m, mean slope 28.4 deg, 90% of
# pixels >15 deg, 45% >30 deg. No reference for that area was touched: only the
# DEM, which is allowed pipeline input.
#
# `download_urls` + `verified_bytes`: fetched by eval/fetch_references.py, which
# caches by URL and writes data/reference/manifest.json with the sha256 of every
# file it pulled. The byte counts below are what those URLs actually returned.
# Every `s1` line is the output of `strandline.run --dry-run` for that bbox/date.
#
# `independent_reference`: TRUE only when the reference was drawn from a sensor
# that is not our own input. Where the reference is Sentinel-1 derived, scoring
# against it flatters us, because the reference shares our input's geometry,
# speckle and look angle. It is FALSE where that is the case, and ALSO false
# where the reference sensor could not be established - unproven independence is
# recorded as not independent, never assumed. Controls carry null: they have no
# reference at all and are scored on false-flood fraction, not on agreement.

events:
  # ======================= STEEP MOUNTAIN VALLEYS =============================
  # The three events whose terrain is closest to a Himalayan gorge, by measured
  # slope: bhutan_punakha (24.4 deg), konjic (21.8 deg), kranj (15.6 deg).

  - name: bhutan_punakha_2024
    kind: flood
    independent_reference: true
    event_date: "2024-08-10"
    bbox: [89.55, 27.40, 89.95, 27.70]
    reference: data/reference/bhutan_punakha_2024/2024-00046-WLD_202408150559_FLDEXT.geojson
    reference_classes:
      water: ["__all__"]        # layer has no attribute columns: every polygon is flood
      debris: []
    source: "Sentinel Asia emergency observation FL-2024-000140-BTN (flood and landslide in Bhutan, 10 Aug 2024, requested by NCHM Bhutan). Activation: https://sentinel-asia.org/EO/2024/article20240810BT.html"
    download_urls:
      - "https://sentinel-asia.org/EO/2024/article20240810BT/JAXA/JAXA_20240815_FPM_ALOS2_Bhutan_FLDEXT.zip"
    verified_bytes: [15215]
    ref_sensor: "JAXA ALOS-2 PALSAR-2, L-band SAR, acquired 2024-08-15 05:59 UTC (+5 d). INDEPENDENT of our Sentinel-1 C-band input."
    ref_extent: "47 polygons, 58.2 ha, bbox [89.425, 27.353, 90.191, 27.905]"
    terrain: "relief 3850 m, elev 1129-4979 m, mean slope 24.4 deg, p90 35.6 deg, 86% of pixels >15 deg, 27% >30 deg"
    s1: "track 150 DESCENDING, post 2024-08-11 (+1 d), 3 pre 2024-05-31..2024-06-24"
    notes: >
      Thimphu Chhu and Pho/Mo Chhu valleys: the steepest dev event and the
      closest analogue to the case-study terrain. CAVEATS, both of which cost us
      recall rather than flatter us: (1) only 3 pre images on the chosen track,
      exactly run.min_pre, so the temporal reference stack is at its thinnest -
      track 114 ASCENDING has 5 pre but post at +11 d; (2) the ALOS-2 reference
      was acquired at +5 d while our post image is +1 d, so water that drained
      in between is in our map and not in the reference. An alternative MBRSC
      Sentinel-1 reference exists (229 polygons, 89.0 ha, verified HTTP 200,
      35373 B, https://sentinel-asia.org/EO/2024/article20240810BT/MBRSC/MBRSC_BHUTAN_FLOODMAP_10TH_AUGUST_SHP.zip)
      but it is Sentinel-1 derived and so is not used for scoring.

