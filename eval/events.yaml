    terrain: "relief 684 m, elev 48-732 m, mean slope 9.2 deg, p90 18.9 deg, 18% of pixels >15 deg, 1% >30 deg"
    s1: "track 37 DESCENDING, post 2021-07-15 (+1 d), 5 pre 2021-06-15..2021-07-09"
    notes: >
      Lower Ahr valley. A deliberately unflattering event: the flood peak passed
