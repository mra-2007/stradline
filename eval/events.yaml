      is dominated by false positives. It is kept because it is the European
      event with the heaviest debris transport and because it ships builtUpA,
      facilitiesA/L and transportationL layers for the damage module. A
      DEL_MONIT01 product also exists (verified HTTP 200, 2525527 B) and is not
      used, to avoid scoring the same AOI twice.

