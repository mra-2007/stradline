    verified_bytes: [8784159]
    ref_sensor: "SPOT-6/7, optical, acquired 2024-10-07 09:34 UTC (+3.4 d). INDEPENDENT of our Sentinel-1 input."
    ref_extent: "10 polygons, 43.2 ha total, bbox [17.8069, 43.6957, 17.9099, 43.7427]"
