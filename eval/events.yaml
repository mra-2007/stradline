    s1: "track 73 ASCENDING, post 2024-10-05 (+1 d), 5 pre 2024-08-06..2024-09-23"
    notes: >
      Neretva gorge, Bosnia and Herzegovina. The only dev event whose reference
      labels BOTH of our output classes: event_type 5-Flood (obj_desc "Riverine
