    ref_sensor: "Sentinel-1, acquired 2023-08-05 16:50 UTC (+1.3 d). NOT independent of our input: same sensor, same kind of processing. Scores for this event are optimistic and must be reported with that caveat."
    ref_extent: "117 polygons, 211.0 ha, bbox [14.1091, 46.0134, 14.7154, 46.3802]; AOI 125505 ha"
