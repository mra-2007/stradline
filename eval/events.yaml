    s1: "track 146 ASCENDING, post 2023-08-05 (+1 d), 5 pre 2023-06-06..2023-07-24"
    notes: >
      Sava, Kokra and Trzic valleys below the Kamnik Alps and the Karavanke, plus
      the Ljubljana basin: Alpine relief with radar shadow and layover on the
      valley walls, which is the same false-flood mechanism the case study will
      face. Classified by CEMS as a flash flood. Version 2 of the product is used
      because CEMS reissued it to correct the thematic accuracy of the flood
      extent; v1 is superseded, not cherry-picked. Our best mountain event by
      flood area, but the reference is Sentinel-1 derived, so it must not carry
      a gate on its own.

  # ======================= EUROPEAN INCISED VALLEYS ===========================
  # Lower relief than the three above, but severe flash floods with heavy debris
  # transport, and the only dev events that also ship building and road layers.

  - name: germany_pruem_2021
    kind: flood
    independent_reference: false   # sensor NOT established; unproven != independent
    event_date: "2021-07-14"
    bbox: [6.3108, 49.8129, 6.7041, 50.3656]
    reference: data/reference/germany_pruem_2021/EMSR517_AOI04_DEL_PRODUCT_observedEventA_r1_v1.shp
    reference_classes:
      water: ["Flooded area"]            # attribute: notation
      debris: []
    source: "Copernicus EMS EMSR517 AOI04 Prum, delineation product (July 2021 flood, Rhineland-Palatinate). Activation: https://mapping.emergency.copernicus.eu/activations/EMSR517/"
    download_urls:
      - "https://cems-mapping-website.s3.eu-west-1.amazonaws.com/static/activations/EMSR517/EMSR517_AOI04_DEL_PRODUCT_r1_RTP01_v1_vector.zip"
    verified_bytes: [10137641]
    ref_sensor: >
      NOT ESTABLISHED. The vector package names no sensor: its source_r1_v1.xml
      is only metadata ABOUT the source table ("File Geodatabase Table"), and
      the table itself is not shipped. The EMS rapid-mapping API covers no
      activation below EMSR656, so it cannot be read programmatically either.
      Only the source date is given: 2021-07-15 (+1 d).
      INDIRECT EVIDENCE that it is SAR, not VHR optical: imageFootprintA holds
      two footprints of 112 x 113 km and 276 x 211 km, and a 276 km swath is
      wide-swath SAR (Sentinel-1 IW is 250 km), far beyond any VHR optical
      scene. observedEventA carries dmg_src_id 2, i.e. the larger footprint.
      TO SETTLE IT, open the delineation map and read its source box:
      https://cems-mapping-website.s3.eu-west-1.amazonaws.com/static/activations/EMSR517/EMSR517_AOI04_DEL_PRODUCT_r1_RTP01_v1.pdf
      (verified HTTP 200, 12103350 B; the text is subset-font encoded so it
      cannot be extracted by script - it has to be read by eye).
      Until then independent_reference stays false.
    ref_extent: "264 polygons, 1061.8 ha, det_method 'Semi-automatic extraction'; AOI 98828 ha"
    terrain: "relief 592 m, elev 125-717 m, mean slope 7.1 deg, p90 14.6 deg, 9% of pixels >15 deg, 0% >30 deg"
    s1: "track 37 DESCENDING, post 2021-07-15 (+1 d), 5 pre 2021-06-15..2021-07-09"
    notes: >
      Prum and Kyll valleys in the Eifel. The largest reference flood extent of
      any dev event (1062 ha), so it carries real statistical weight, and the
      post image is +1 d. Ships builtUpA and transportationL/A layers, which the
      damage module will need later.

