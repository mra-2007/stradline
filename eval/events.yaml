  # ============================== NO-FLOOD CONTROLS ===========================
  # Same bbox and, where possible, the same relative orbit as the paired flood
  # event, on a date with no reported flood. These measure the false-flood rate
  # (gate: <= 1%). They have no reference file and nothing to download:
  # the metric is the fraction of the AOI we wrongly call flood.
  #
  # HONEST LIMIT ON ALL CONTROLS: "no flood" here means no Copernicus EMS
  # activation and no Sentinel Asia emergency observation covers this bbox at
  # this date. That is weaker than a confirmed dry observation - a small
  # unmapped flood would be scored against us, which is the safe direction. The
  # Alpine and Himalayan controls are deliberately NOT all dry-season: wet snow
  # and low sun are themselves false-flood mechanisms we need to measure.

  - name: slovenia_kranj_control_2023
    kind: control
    independent_reference: null    # no reference: scored on false-flood fraction
    event_date: "2023-06-10"
    bbox: [14.0029, 46.0089, 14.7162, 46.4361]
    source: "No Copernicus EMS activation covers this bbox on this date; the EMSR680 activation for this area is dated 2023-08-04. https://mapping.emergency.copernicus.eu/activations/EMSR680/"
    terrain: "relief 2262 m, mean slope 15.6 deg, 48% of pixels >15 deg"
    s1: "track 44 ASCENDING, post 2023-06-11 (+1 d), 5 pre 2023-04-12..2023-05-30"
    notes: >
      Alpine control two months before the flood: radar shadow and layover on the
      valley walls, plus residual wet snow at altitude in April-May, are the main
      false-flood risks for the case study. Different track from the flood event
      (44 ASC vs 146 ASC) because 146 has no full-coverage post image here.

