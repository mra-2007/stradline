      reference inside an 8047 ha AOI is 0.5% positives, so a handful of false
      positives destroys precision here. The reference is also +3.4 d optical
      against our +1 d radar post image, so the receding-water mismatch is real.
      Do not narrow this bbox or drop this event to lift the mean.

